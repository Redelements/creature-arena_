name: tests

# Runs the whole suite on every pull request and on main. A push to a PR branch used to
# run it twice (once as a push, once as the pull request): now only main's pushes run as
# pushes. The suite is split over three runners (TEST_SHARD in tests/run_tests.gd), which
# cuts the wait for a green check from about nine minutes of tests to about three.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the tests only read the repository.
permissions:
  contents: read

# A new push to the same branch cancels the run still going for the old one.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shard:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    name: tests (shard ${{ matrix.shard }} of 3)
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Codebase map is up to date
        if: matrix.shard == 1
        run: python3 tools/codebase_map.py --check

      - name: Download Godot (checked against the release's SHA512-SUMS)
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o "$zip" "$base/$zip"
          curl -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          grep " ${zip}\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

      - name: Import project
        run: ./godot --headless --path . --import

      - name: Run tests
        env:
          TEST_SHARD: ${{ matrix.shard }}/3
        run: ./godot --headless --path . --script res://tests/run_tests.gd

  # The one check main's ruleset requires ("test"): green only when every shard is.
  test:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: |
          echo "shards: ${{ needs.shard.result }}"
          test "${{ needs.shard.result }}" = "success"
