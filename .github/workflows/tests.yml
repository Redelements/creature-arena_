name: tests

on:
  push:
  pull_request:

# Least privilege: the tests only read the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Codebase map is up to date
        run: python3 tools/codebase_map.py --check

      - name: Download Godot (checked against the release's SHA512-SUMS)
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o "$zip" "$base/$zip"
          curl -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          grep " ${zip}\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot

      - name: Import project
        run: ./godot --headless --path . --import

      - name: Run tests
        run: ./godot --headless --path . --script res://tests/run_tests.gd
