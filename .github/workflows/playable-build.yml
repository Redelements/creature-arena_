name: playable build

# Exports a Windows, a Linux and an Android (debug APK) build of main on every push to it,
# and of any branch by hand (Actions > playable build > Run workflow, pick the branch): a
# manual run on a branch with an open pull request posts one bot comment there linking the
# builds. Pull requests no longer get a build by themselves: on a public repository every
# artifact can be downloaded by anyone signed in to GitHub, so builds are made on purpose
# and kept three days. The cross-platform determinism check that used to run here on the
# exported builds is determinism.yml (every PR, from the editor binaries); macOS is nightly.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playable-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
      SIM_CHECK_SEED: 20261010
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
      linux_digest: ${{ steps.simcheck.outputs.digest }}
      win_url: ${{ steps.win.outputs.artifact-url }}
      linux_url: ${{ steps.linux.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Short commit id
        id: sha
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "SHORT_SHA=${SHA::7}" >> "$GITHUB_ENV"
          echo "short_sha=${SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-win-linux-v2

      - name: Download Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-cache/templates
          cd ~/godot-cache
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          # Each download is checked against the release's own SHA512-SUMS.txt.
          curl -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o "$zip" "$base/$zip"
          grep " ${zip}\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip" && rm "$zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && chmod +x godot
          # The full template archive is ~1.2 GB; keep only the two platforms we ship.
          tpz="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl -fsSL -o templates.tpz "$base/$tpz"
          echo "$(grep " ${tpz}\$" SHA512-SUMS.txt | cut -d' ' -f1)  templates.tpz" | sha512sum -c -
          rm SHA512-SUMS.txt
          unzip -q -j templates.tpz templates/windows_release_x86_64.exe \
            templates/linux_release.x86_64 templates/version.txt -d templates
          rm templates.tpz

      - name: Install export templates
        run: |
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          cp ~/godot-cache/templates/* "$dest/"

      # The same import cache as tests.yml (Godot reimports only sources whose md5 changed).
      - name: Cache the project import
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .godot/imported
          key: import-linux-${{ env.GODOT_VERSION }}-${{ hashFiles('**/*.import', 'assets/**', 'project.godot') }}
          restore-keys: |
            import-linux-${{ env.GODOT_VERSION }}-

      - name: Import project
        run: ~/godot-cache/godot --headless --path . --import

      - name: Export builds
        run: |
          mkdir -p build/windows build/linux
          # Linux keeps the old file and artifact names (CreatureArena.x86_64 in
          # CreatureArena-linux-<sha>): tools/server/update.sh downloads them by name.
          ~/godot-cache/godot --headless --path . --export-release "Windows" build/windows/Ready4Rambles.exe
          ~/godot-cache/godot --headless --path . --export-release "Linux" build/linux/CreatureArena.x86_64
          test -s build/windows/Ready4Rambles.exe
          test -s build/windows/Ready4Rambles.pck
          test -s build/linux/CreatureArena.x86_64
          # The server's update script prints the same for the binary it installs.
          sha256sum build/linux/CreatureArena.x86_64 build/windows/Ready4Rambles.pck

      # The Windows game data ships as Ready4Rambles.pck beside the exe, not embedded in
      # it. An exe with the data glued in is a new, unsigned program on every build, and
      # browsers (Chrome's "dangerous file") and antivirus flag those as false positives.
      # Unembedded, the exe is byte for byte Godot's official runtime, the same file every
      # Godot 4.7.2 game ships, which this checks.
      - name: Windows exe is the stock Godot runtime
        run: |
          sha256sum build/windows/Ready4Rambles.exe ~/godot-cache/templates/windows_release_x86_64.exe
          if cmp -s build/windows/Ready4Rambles.exe ~/godot-cache/templates/windows_release_x86_64.exe; then
            echo "Ready4Rambles.exe is identical to the official Godot ${GODOT_VERSION} Windows runtime."
          else
            echo "::warning::Ready4Rambles.exe differs from the official Godot runtime template."
          fi

      - name: Smoke test the Linux build
        run: |
          out=$(timeout 120 build/linux/CreatureArena.x86_64 --headless -- --showcase=cairn --quit-after=700 2>&1 || true)
          echo "$out" | tail -5
          if echo "$out" | grep -E "SCRIPT ERROR|Parse Error|Failed to load"; then exit 1; fi

      - name: Smoke test the Linux build as a dedicated server
        run: |
          out=$(timeout 8 build/linux/CreatureArena.x86_64 --headless -- --server=7777 2>&1 || true)
          echo "$out" | tail -3
          if echo "$out" | grep -E "SCRIPT ERROR|Parse Error|Failed to load"; then exit 1; fi
          echo "$out" | grep -q "Ready 4 Rambles server on UDP port 7777"
          echo "$out" | grep -q "find the server by itself (UDP port 7778"

      - name: Determinism fingerprint (Linux build)
        id: simcheck
        run: |
          # Absolute path: an exported game reads relative paths from inside its own package.
          timeout 300 build/linux/CreatureArena.x86_64 --headless -- --sim-check=$SIM_CHECK_SEED --sim-check-out="$PWD/linux_digest.txt"
          digest=$(cat linux_digest.txt)
          echo "Linux: $digest"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Add a readme to each build
        run: |
          for dir in build/windows build/linux; do
            cat > "$dir/README.txt" <<EOF
          Ready 4 Rambles - prototype build ${SHORT_SHA}

          Windows: keep Ready4Rambles.exe and Ready4Rambles.pck together (the .pck is
          the game), then double-click Ready4Rambles.exe. Windows may say it's from an
          unknown publisher: choose "More info", then "Run anyway".
          Linux: chmod +x CreatureArena.x86_64, then run it (the Linux file keeps the
          old name: the game server's update script installs it by that name).

          An Xbox controller works any time. Keyboard + mouse: pick a layout in the menu.
          Esc: back to the menu. M: mute music. F1: hitboxes. F3: hide the controls strip.
          "Watch: combo showcases" in the menu plays scripted demos of every move.
          EOF
          done
          chmod +x build/linux/CreatureArena.x86_64

      - name: Upload Windows build
        id: win
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Ready4Rambles-windows-${{ env.SHORT_SHA }}
          path: build/windows
          retention-days: 3

      - name: Upload Linux build
        id: linux
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: CreatureArena-linux-${{ env.SHORT_SHA }}
          path: build/linux
          retention-days: 3

  # A debug APK for Android handhelds and phones (arm64; tested on an AYN Odin 3). Godot
  # finds the SDK and Java through ANDROID_HOME and JAVA_HOME; the debug key is made
  # here, so the APK installs as an update only over another CI build of the same key.
  android:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    outputs:
      apk_url: ${{ steps.apk.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Short commit id
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "SHORT_SHA=${SHA::7}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.1" "platforms;android-35" > /dev/null

      - name: Cache Godot and Android templates
        id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-android-v2

      - name: Download Godot and Android templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-cache/templates
          cd ~/godot-cache
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          # Each download is checked against the release's own SHA512-SUMS.txt.
          curl -fsSL -o SHA512-SUMS.txt "$base/SHA512-SUMS.txt"
          zip="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o "$zip" "$base/$zip"
          grep " ${zip}\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip" && rm "$zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && chmod +x godot
          tpz="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl -fsSL -o templates.tpz "$base/$tpz"
          echo "$(grep " ${tpz}\$" SHA512-SUMS.txt | cut -d' ' -f1)  templates.tpz" | sha512sum -c -
          rm SHA512-SUMS.txt
          unzip -q -j templates.tpz templates/android_debug.apk templates/version.txt -d templates
          rm templates.tpz

      - name: Install export templates and a debug key
        run: |
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          cp ~/godot-cache/templates/* "$dest/"
          keytool -genkeypair -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey             -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      # Every import writes both the desktop and the mobile texture variants, so one cache
      # serves this job and the Linux ones.
      - name: Cache the project import
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .godot/imported
          key: import-linux-${{ env.GODOT_VERSION }}-${{ hashFiles('**/*.import', 'assets/**', 'project.godot') }}
          restore-keys: |
            import-linux-${{ env.GODOT_VERSION }}-

      - name: Import project
        run: ~/godot-cache/godot --headless --path . --import

      - name: Export the APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          ~/godot-cache/godot --headless --path . --export-debug "Android" build/android/Ready4Rambles.apk
          test -s build/android/Ready4Rambles.apk
          rm -f build/android/*.idsig

      - name: Upload Android build
        id: apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Ready4Rambles-android-${{ env.SHORT_SHA }}
          path: build/android
          retention-days: 3

  comment:
    if: github.event_name == 'workflow_dispatch' && !cancelled()
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment download links on the branch's pull request, if it has one
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
          WIN_URL: ${{ needs.build.outputs.win_url }}
          LINUX_URL: ${{ needs.build.outputs.linux_url }}
          APK_URL: ${{ needs.android.outputs.apk_url }}
        with:
          script: |
            const marker = '<!-- playable-build -->';
            const { owner, repo } = context.repo;
            const branch = context.ref.replace('refs/heads/', '');
            const prs = await github.rest.pulls.list({ owner, repo, state: 'open', head: `${owner}:${branch}` });
            if (prs.data.length === 0) {
              core.info(`No open pull request for ${branch}: the builds are on this run's page.`);
              return;
            }
            const issue_number = prs.data[0].number;
            const body = [
              marker,
              `### 🎮 Playable build: \`${process.env.SHORT_SHA}\``,
              '',
              `- **Windows:** [download](${process.env.WIN_URL})`,
              `- **Linux:** [download](${process.env.LINUX_URL})`,
              process.env.APK_URL ? `- **Android** (debug APK, arm64): [download](${process.env.APK_URL})` : '- **Android:** the build failed (see the android job)',
              '',
              'Unzip, keep `Ready4Rambles.exe` and `Ready4Rambles.pck` together, and run the exe. If Windows warns about an unknown publisher, choose **More info → Run anyway**.',
              'Android: unzip, copy `Ready4Rambles.apk` to the device and open it (allow installs from that app when asked), or `adb install -r Ready4Rambles.apk`.',
              'If Chrome blocks the download as dangerous: open `chrome://downloads`, find it, and choose **Keep** (or ⋮ → **Download dangerous file**). The exe is the official Godot runtime, unchanged.',
              'You need to be signed in to GitHub to download. Builds are kept for 3 days; this comment updates on every manual run of the playable build for this branch.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
