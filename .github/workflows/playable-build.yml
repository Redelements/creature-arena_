name: playable build

# Exports a Windows, a Linux and an Android (debug APK) build of every pull request
# (and of main), so each change can be downloaded and played. On a PR, a single bot comment links the latest
# builds and is updated on every push.
#
# It also checks cross-platform determinism, which rollback netcode depends on: the
# Linux and Windows builds each play the same seeded match and must produce the exact
# same state fingerprint.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: playable-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
      SIM_CHECK_SEED: 20261010
    outputs:
      short_sha: ${{ steps.sha.outputs.short_sha }}
      linux_digest: ${{ steps.simcheck.outputs.digest }}
      win_url: ${{ steps.win.outputs.artifact-url }}
      linux_url: ${{ steps.linux.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Short commit id
        id: sha
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "SHORT_SHA=${SHA::7}" >> "$GITHUB_ENV"
          echo "short_sha=${SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-win-linux-v1

      - name: Download Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-cache/templates
          cd ~/godot-cache
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && chmod +x godot
          # The full template archive is ~1.2 GB; keep only the two platforms we ship.
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz templates/windows_release_x86_64.exe \
            templates/linux_release.x86_64 templates/version.txt -d templates
          rm templates.tpz

      - name: Install export templates
        run: |
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          cp ~/godot-cache/templates/* "$dest/"

      - name: Import project
        run: ~/godot-cache/godot --headless --path . --import

      - name: Export builds
        run: |
          mkdir -p build/windows build/linux
          ~/godot-cache/godot --headless --path . --export-release "Windows" build/windows/CreatureArena.exe
          ~/godot-cache/godot --headless --path . --export-release "Linux" build/linux/CreatureArena.x86_64
          test -s build/windows/CreatureArena.exe
          test -s build/windows/CreatureArena.pck
          test -s build/linux/CreatureArena.x86_64

      # The Windows game data ships as CreatureArena.pck beside the exe, not embedded in
      # it. An exe with the data glued in is a new, unsigned program on every build, and
      # browsers (Chrome's "dangerous file") and antivirus flag those as false positives.
      # Unembedded, the exe is byte for byte Godot's official runtime, the same file every
      # Godot 4.7.2 game ships, which this checks.
      - name: Windows exe is the stock Godot runtime
        run: |
          sha256sum build/windows/CreatureArena.exe ~/godot-cache/templates/windows_release_x86_64.exe
          if cmp -s build/windows/CreatureArena.exe ~/godot-cache/templates/windows_release_x86_64.exe; then
            echo "CreatureArena.exe is identical to the official Godot ${GODOT_VERSION} Windows runtime."
          else
            echo "::warning::CreatureArena.exe differs from the official Godot runtime template."
          fi

      - name: Smoke test the Linux build
        run: |
          out=$(timeout 120 build/linux/CreatureArena.x86_64 --headless -- --showcase=cairn --quit-after=700 2>&1 || true)
          echo "$out" | tail -5
          if echo "$out" | grep -E "SCRIPT ERROR|Parse Error|Failed to load"; then exit 1; fi

      - name: Smoke test the Linux build as a dedicated server
        run: |
          out=$(timeout 8 build/linux/CreatureArena.x86_64 --headless -- --server=7777 2>&1 || true)
          echo "$out" | tail -3
          if echo "$out" | grep -E "SCRIPT ERROR|Parse Error|Failed to load"; then exit 1; fi
          echo "$out" | grep -q "Creature Arena server on UDP port 7777"
          echo "$out" | grep -q "find the server by itself (UDP port 7778"

      - name: Determinism fingerprint (Linux build)
        id: simcheck
        run: |
          # Absolute path: an exported game reads relative paths from inside its own package.
          timeout 300 build/linux/CreatureArena.x86_64 --headless -- --sim-check=$SIM_CHECK_SEED --sim-check-out="$PWD/linux_digest.txt"
          digest=$(cat linux_digest.txt)
          echo "Linux: $digest"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Add a readme to each build
        run: |
          for dir in build/windows build/linux; do
            cat > "$dir/README.txt" <<EOF
          Creature Arena - prototype build ${SHORT_SHA}

          Windows: keep CreatureArena.exe and CreatureArena.pck together (the .pck is
          the game), then double-click CreatureArena.exe. Windows may say it's from an
          unknown publisher: choose "More info", then "Run anyway".
          Linux: chmod +x CreatureArena.x86_64, then run it.

          An Xbox controller works any time. Keyboard + mouse: pick a layout in the menu.
          Esc: back to the menu. M: mute music. F1: hitboxes. F3: hide the controls strip.
          "Watch: combo showcases" in the menu plays scripted demos of every move.
          EOF
          done
          chmod +x build/linux/CreatureArena.x86_64

      - name: Upload Windows build
        id: win
        uses: actions/upload-artifact@v4
        with:
          name: CreatureArena-windows-${{ env.SHORT_SHA }}
          path: build/windows
          retention-days: 30

      - name: Upload Linux build
        id: linux
        uses: actions/upload-artifact@v4
        with:
          name: CreatureArena-linux-${{ env.SHORT_SHA }}
          path: build/linux
          retention-days: 30

  # A debug APK for Android handhelds and phones (arm64; tested on an AYN Odin 3). Godot
  # finds the SDK and Java through ANDROID_HOME and JAVA_HOME; the debug key is made
  # here, so the APK installs as an update only over another CI build of the same key.
  android:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    outputs:
      apk_url: ${{ steps.apk.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v4

      - name: Short commit id
        run: |
          SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          echo "SHORT_SHA=${SHA::7}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "build-tools;35.0.1" "platforms;android-35" > /dev/null

      - name: Cache Godot and Android templates
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot-cache
          key: godot-${{ env.GODOT_VERSION }}-android-v1

      - name: Download Godot and Android templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-cache/templates
          cd ~/godot-cache
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && chmod +x godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j templates.tpz templates/android_debug.apk templates/version.txt -d templates
          rm templates.tpz

      - name: Install export templates and a debug key
        run: |
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          cp ~/godot-cache/templates/* "$dest/"
          keytool -genkeypair -keystore "$HOME/debug.keystore" -storepass android -alias androiddebugkey             -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Import project
        run: ~/godot-cache/godot --headless --path . --import

      - name: Export the APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build/android
          ~/godot-cache/godot --headless --path . --export-debug "Android" build/android/CreatureArena.apk
          test -s build/android/CreatureArena.apk
          rm -f build/android/*.idsig

      - name: Upload Android build
        id: apk
        uses: actions/upload-artifact@v4
        with:
          name: CreatureArena-android-${{ env.SHORT_SHA }}
          path: build/android
          retention-days: 30

  comment:
    if: github.event_name == 'pull_request' && !cancelled()
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - name: Comment download links on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          SHORT_SHA: ${{ needs.build.outputs.short_sha }}
          WIN_URL: ${{ needs.build.outputs.win_url }}
          LINUX_URL: ${{ needs.build.outputs.linux_url }}
          APK_URL: ${{ needs.android.outputs.apk_url }}
        with:
          script: |
            const marker = '<!-- playable-build -->';
            const body = [
              marker,
              `### 🎮 Playable build: \`${process.env.SHORT_SHA}\``,
              '',
              `- **Windows:** [download](${process.env.WIN_URL})`,
              `- **Linux:** [download](${process.env.LINUX_URL})`,
              process.env.APK_URL ? `- **Android** (debug APK, arm64): [download](${process.env.APK_URL})` : '- **Android:** the build failed (see the android job)',
              '',
              'Unzip, keep `CreatureArena.exe` and `CreatureArena.pck` together, and run the exe. If Windows warns about an unknown publisher, choose **More info → Run anyway**.',
              'Android: unzip, copy `CreatureArena.apk` to the device and open it (allow installs from that app when asked), or `adb install -r CreatureArena.apk`.',
              'If Chrome blocks the download as dangerous: open `chrome://downloads`, find it, and choose **Keep** (or ⋮ → **Download dangerous file**). The exe is the official Godot runtime, unchanged.',
              'You need to be signed in to GitHub to download. Builds are kept for 30 days and this comment updates on every push.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # Apple Silicon compiles floating-point math differently (fused multiply-add), so the
  # same check runs on macOS with the stock editor binary (there is no Mac export yet).
  mac-determinism:
    needs: build
    runs-on: macos-latest
    env:
      GODOT_VERSION: 4.7.2
      SIM_CHECK_SEED: 20261010
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot for macOS
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip
          chmod +x Godot.app/Contents/MacOS/Godot

      - name: Import project
        run: Godot.app/Contents/MacOS/Godot --headless --path . --import

      - name: Same match on macOS must give the same fingerprint
        run: |
          Godot.app/Contents/MacOS/Godot --headless --path . -- --sim-check=$SIM_CHECK_SEED --sim-check-out="$PWD/mac_digest.txt"
          mac=$(cat mac_digest.txt)
          linux="${{ needs.build.outputs.linux_digest }}"
          echo "Linux: $linux"
          echo "macOS: $mac"
          if [ "$mac" != "$linux" ]; then
            echo "Desync: macOS and Linux simulate the same match differently. Fixed-point math in src/sim/ would be the fix."
            exit 1
          fi
          echo "Match: both platforms simulate identically."

  cross-platform-determinism:
    needs: build
    runs-on: windows-latest
    env:
      SIM_CHECK_SEED: 20261010
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CreatureArena-windows-${{ needs.build.outputs.short_sha }}
          path: win

      - name: Same match on Windows must give the same fingerprint
        shell: pwsh
        run: |
          $out = Join-Path $PWD "win_digest.txt"
          Start-Process -FilePath "win\CreatureArena.exe" -Wait -NoNewWindow `
            -ArgumentList "--headless", "--", "--sim-check=$env:SIM_CHECK_SEED", "--sim-check-out=$out"
          $win = (Get-Content $out -Raw).Trim()
          $linux = "${{ needs.build.outputs.linux_digest }}"
          Write-Host "Linux:   $linux"
          Write-Host "Windows: $win"
          if ($win -ne $linux) {
            Write-Error "Desync: Windows and Linux simulate the same match differently. Online play would break."
            exit 1
          }
          Write-Host "Match: both platforms simulate identically."
